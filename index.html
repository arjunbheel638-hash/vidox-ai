<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidox AI - All AI Tools</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:system-ui, sans-serif;padding:15px;padding-bottom:90px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.logo{font-size:24px;font-weight:900}
.logo b{color:#4a8cff}
.upgrade{background:linear-gradient(90deg,#9b24ed,#ff8a00);padding:8px 16px;border-radius:20px;font-weight:700;font-size:14px}
h2{font-size:18px;letter-spacing:1px;margin:25px 0 15px 5px;color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{text-align:center}
.card-img{width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:#1a1a1a;border:1px solid #222}
.card-img img{width:100%;height:100%;object-fit:cover}
.card p{margin-top:8px;font-size:13px;font-weight:600}
.circle-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.circle-card{text-align:center;position:relative}
.circle{width:100%;aspect-ratio:1/1;border-radius:50%;background:#1e1e1e;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:32px}
.badge{position:absolute;top:-5px;right:10px;background:white;color:black;font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1c1c1f;border-top-left-radius:20px;border-top-right-radius:20px;display:flex;justify-content:space-around;padding:12px 0}
.nav-item{text-align:center;font-size:11px;color:#777}
.nav-item.active{color:white}
</style>
</head>
<body>
<div class="top">
  <div class="logo">vidox<span style="color:#4a8cff">ai</span></div>
  <div style="display:flex;gap:12px;align-items:center">
    <div>⚡0</div>
    <div class="upgrade">Upgrade</div>
    <div>👤</div>
  </div>
</div>

<h2>AI TOOLS</h2>
<div class="grid">
  <div class="card" onclick="openTool('animation')">
    <div class="card-img"><img src="https://i.imgur.com/8Km9tLL.png"></div>
    <p>Animation Studio</p>
  </div>
  <div class="card" onclick="openTool('cinema')">
    <div class="card-img"><img src="https://i.imgur.com/QvUX9kR.png"></div>
    <p>Cinema Studio</p>
  </div>
  <div class="card" onclick="openTool('ad')">
    <div class="card-img"><img src="https://i.imgur.com/2nCt3Sbl.png"></div>
    <p>Ad Studio</p>
  </div>
  <div class="card" onclick="openTool('whiteboard')">
    <div class="card-img"><img src="https://i.imgur.com/m5a3p8s.png"></div>
    <p>Whiteboard AI</p>
  </div>
</div>

<h2>MORE CREATOR TOOLS</h2>
<div class="circle-grid">
  <div class="circle-card" onclick="openTool('seo')"><span class="badge">NEW</span><div class="circle">🔍</div><p>Video SEO Writer</p></div>
  <div class="circle-card" onclick="openTool('story')"><span class="badge">NEW</span><div class="circle">📝</div><p>AI Story Writer</p></div>
  <div class="circle-card" onclick="openTool('guru')"><span class="badge">NEW</span><div class="circle">📊</div><p>AI Guru</p></div>
  <div class="circle-card" onclick="openTool('image')"><div class="circle">🖌️</div><p>AI Image</p></div>
  <div class="circle-card" onclick="openTool('voice')"><div class="circle">🎙️</div><p>AI Voice</p></div>
  <div class="circle-card" onclick="openTool('video')"><div class="circle">📷</div><p>AI Video</p></div>
</div>

<div class="bottom-nav">
  <div class="nav-item active">🏠<br>Home</div>
  <div class="nav-item">📖<br>Story Gen</div>
  <div class="nav-item">🤖<br>AI Guru</div>
  <div class="nav-item">🔍<br>Video SEO</div>
  <div class="nav-item">🎓<br>Tutorials</div>
</div>
<script>
function openTool(name){
  // abhi sab tools tumhare video generator pe le jayenge
  // baad me har ek ka alag AI laga denge
  window.location.href = "generator.html?type="+name;
}
</script>
</body>
